<title>Hải quan Việt Nam - Chọn ngôn ngữ</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(145deg,#eaf5ff,#f8fbff);display:flex;justify-content:center;align-items:center;padding:20px;color:#17324d}
.card{width:100%;max-width:560px;background:#fff;border-radius:26px;padding:30px 24px 24px;text-align:center;box-shadow:0 18px 55px rgba(20,65,105,.16)}
.logo{width:125px;height:125px;object-fit:cover;border-radius:50%;display:block;margin:0 auto 18px;box-shadow:0 8px 22px rgba(0,0,0,.12)}
h1{font-size:25px;margin:0;color:#0b4f8a}
h2{font-size:18px;margin:8px 0 5px;font-weight:600;color:#344b60}
.subtitle{margin:0 0 24px;color:#778898;font-size:14px}
.languages{display:grid;gap:11px}
.language{display:flex;align-items:center;gap:14px;padding:15px 17px;background:#fff;border:1px solid #e1e9f0;border-radius:15px;text-decoration:none;color:#17324d;text-align:left;transition:.2s}
.language:hover,.language:active{transform:translateY(-2px);border-color:#0b5cab;box-shadow:0 7px 18px rgba(11,92,171,.13)}
.flag{font-size:30px;width:42px;text-align:center;flex:none}
.lang-name{font-size:17px;font-weight:700}
.lang-native{font-size:12px;color:#80909e;margin-top:3px}
.arrow{margin-left:auto;font-size:25px;color:#9baab6}
.note{font-size:11px;color:#9aa7b2;margin-top:20px}
@media(max-width:420px){.card{padding:24px 15px 20px;border-radius:21px}.logo{width:105px;height:105px}h1{font-size:22px}.language{padding:13px 14px}}
</style>
